            </form>

            <!-- Forgot Password Form -->
            <form id="forgot-form" onsubmit="event.preventDefault();" style="display: none;">
                <p style="font-size: 13.5px; color: var(--text-muted); margin-top: -16px; margin-bottom: 24px; text-align: left; line-height: 1.5;">
                    Enter the email address associated with your account, and we will simulate sending a password reset link.
                </p>

                <div class="input-group">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="forgot-email" placeholder="Email Address" required>
                </div>
                
                <button type="submit" id="forgot-submit-btn" class="login-btn" disabled>
                    <span id="forgot-btn-text">Send Reset Link</span>
                    <div id="forgot-btn-spinner" class="login-spinner" style="display: none;"></div>
                </button>
                
                <div style="margin-top: 16px;">
                    <a id="link-to-login-from-forgot" class="auth-redirect-link">Back to Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // DOM Elements
        const valveToggle = document.getElementById('valve-toggle');
        const autoToggle = document.getElementById('auto-toggle');
        const flowVal = document.getElementById('flow-val');
        const leakVal = document.getElementById('leak-val');
        const leakMetric = document.getElementById('leak-metric');
        const tankWater = document.getElementById('tank-water');
        const tankText = document.getElementById('tank-text');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const valveDesc = document.getElementById('valve-desc');
        const consoleLog = document.getElementById('console');
        
        // Buttons
        const btnLeak = document.getElementById('btn-leak');
        const btnOverflow = document.getElementById('btn-overflow');
        const btnReset = document.getElementById('btn-reset');

        // Auth Common Elements
        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const loginError = document.getElementById('login-error');
        const loginSuccess = document.getElementById('login-success');
        const btnLogout = document.getElementById('btn-logout');

        // Login Page Elements
        const loginForm = document.getElementById('login-form');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginTogglePassword = document.getElementById('login-toggle-password');
        const loginSubmitBtn = document.getElementById('login-submit-btn');
        const loginBtnText = document.getElementById('login-btn-text');
        const loginBtnSpinner = document.getElementById('login-btn-spinner');
        const linkForgotPassword = document.getElementById('link-forgot-password');
        const linkToRegister = document.getElementById('link-to-register');

        // Register Page Elements
        const registerForm = document.getElementById('register-form');
        const registerName = document.getElementById('register-name');
        const registerEmail = document.getElementById('register-email');
        const registerPassword = document.getElementById('register-password');
        const registerTogglePassword = document.getElementById('register-toggle-password');
        const registerSubmitBtn = document.getElementById('register-submit-btn');
        const registerBtnText = document.getElementById('register-btn-text');
        const registerBtnSpinner = document.getElementById('register-btn-spinner');
        const linkToLoginFromReg = document.getElementById('link-to-login-from-reg');

        // Forgot Password Page Elements
        const forgotForm = document.getElementById('forgot-form');
        const forgotEmail = document.getElementById('forgot-email');
        const forgotSubmitBtn = document.getElementById('forgot-submit-btn');
        const forgotBtnText = document.getElementById('forgot-btn-text');
        const forgotBtnSpinner = document.getElementById('forgot-btn-spinner');
        const linkToLoginFromForgot = document.getElementById('link-to-login-from-forgot');

        // State variables
        let valveOpen = true;
        let autoMode = true;
        let leakDetected = false;
        let waterLevel = 68;
        let flowRate = 12.5;

        // Log Console Helper
        function addLog(message, type = 'info') {
            const now = new Date();
            const timeStr = `[${now.toTimeString().split(' ')[0]}]`;
            
            const line = document.createElement('div');
            line.className = 'log-line';
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = timeStr;
            
            const msgSpan = document.createElement('span');
            msgSpan.className = `log-${type}`;
            msgSpan.textContent = message;
            
            line.appendChild(timeSpan);
            line.appendChild(msgSpan);
            consoleLog.appendChild(line);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        // Update UI based on state
        function updateUI() {
            // Valve
            valveToggle.checked = valveOpen;
            if (valveOpen) {
                flowRate = leakDetected ? 24.8 : 12.5;
                flowVal.textContent = `${flowRate} L/min`;
                valveDesc.textContent = "Valve is OPEN (Water Flowing)";
                valveDesc.style.color = "var(--primary-color)";
            } else {
                flowRate = 0;
                flowVal.textContent = "0.0 L/min";
                valveDesc.textContent = "Valve is CLOSED (Water Blocked)";
                valveDesc.style.color = "var(--danger-color)";
            }

            // Tank
            tankWater.style.height = `${waterLevel}%`;
            tankText.textContent = `${waterLevel}%`;

            // Leak
            if (leakDetected) {
                leakVal.textContent = "LEAK DETECTED";
                leakVal.style.color = "var(--danger-color)";
                leakMetric.classList.add('alert-active');
            } else {
                leakVal.textContent = "Secure";
                leakVal.style.color = "var(--success-color)";
                leakMetric.classList.remove('alert-active');
            }

            // Alarm Badges
            if (leakDetected) {
                statusBadge.className = "system-status alarm";
                statusText.textContent = "CRITICAL ALARM: LEAK";
            } else if (waterLevel >= 95) {
                statusBadge.className = "system-status alarm";
                statusText.textContent = "WARNING: TANK OVERFLOW";
            } else {
                statusBadge.className = "system-status";
                statusText.textContent = "System Secure";
            }
        }

        // Toggle Valve manually
        valveToggle.addEventListener('change', (e) => {
            valveOpen = e.target.checked;
            addLog(`User requested Valve ${valveOpen ? 'OPEN' : 'CLOSE'}.`, 'info');
            updateUI();
        });

        // Toggle Auto Mode
        autoToggle.addEventListener('change', (e) => {
            autoMode = e.target.checked;
            addLog(`Auto Protection Mode ${autoMode ? 'ENABLED' : 'DISABLED'}.`, 'info');
        });

        // Simulate Leakage
        btnLeak.addEventListener('click', () => {
            leakDetected = true;
            addLog("HARDWARE ALERT: Moisture sensor triggered. Leak detected!", "error");
            
            if (autoMode) {
                valveOpen = false;
                addLog("AUTO-PROTECTION: Safety shutoff triggered. Closing solenoid valve.", "warn");
            } else {
                addLog("WARNING: Leak detected but Auto Mode is disabled. Valve remains open!", "warn");
            }
            updateUI();
        });

        // Simulate Overflow
        btnOverflow.addEventListener('click', () => {
            waterLevel = 98;
            addLog("HARDWARE ALERT: Ultrasonic sensor reports water level at 98%.", "warn");
            
            if (autoMode) {
                valveOpen = false;
                addLog("AUTO-PROTECTION: Tank full. Closing solenoid valve to prevent overflow.", "warn");
            }
            updateUI();
        });

        // Reset
        btnReset.addEventListener('click', () => {
            leakDetected = false;
            waterLevel = 68;
            valveOpen = true;
            addLog("Simulation reset. Systems returned to normal operation.", "success");
            updateUI();
        });

        // Background simulation logic (simulate slow water consumption/filling)
        setInterval(() => {
            if (valveOpen && waterLevel < 95 && !leakDetected) {
                waterLevel = Math.min(95, waterLevel + 1);
                updateUI();
            }
        }, 6000);

        // --- LIVE VIDEO MONITORING SIMULATION ---
        const canvas = document.getElementById('camera-canvas');
        const ctx = canvas.getContext('2d');

        // State for video
        let activeCam = 'cam1'; // 'cam1', 'cam2', or 'cam3'
        let videoFilter = 'normal'; // 'normal', 'nv', 'thermal'
        let ptzX = 0;
        let ptzY = 0;
        let ptzZoom = 1.0;
        let staticIntensity = 0.0;
        
        // Webcam & Video File state
        let webcamStream = null;
        let webcamActive = false;
        let webcamError = false;
        let activeVideoUrl = null; // Store local file object URL to revoke later
        let videoSourceMode = 'webcam'; // 'webcam' or 'file'
        
        const webcamVideo = document.getElementById('webcam-video');
        
        // Webcam Source Control DOM elements
        const webcamSourceControl = document.getElementById('webcam-source-control');
        const btnSrcWebcam = document.getElementById('btn-src-webcam');
        const btnSrcFile = document.getElementById('btn-src-file');
        const videoFileInput = document.getElementById('video-file-input');
        
        // Droplets for Cam 1
        let droplets = [];
        // Particles for Cam 2
        let particles = [];

        // UI Tabs & controls
        const cam1Tab = document.getElementById('cam1-tab');
        const cam2Tab = document.getElementById('cam2-tab');
        const cam3Tab = document.getElementById('cam3-tab');
        const filterNormal = document.getElementById('filter-normal');
        const filterNv = document.getElementById('filter-nv');
        const filterThermal = document.getElementById('filter-thermal');
        const camName = document.getElementById('cam-name');
        const camTime = document.getElementById('cam-time');
        const camAnomaly = document.getElementById('cam-anomaly');
        const camRecText = document.getElementById('cam-rec-text');
        
        // PTZ Buttons
        const ptzUp = document.getElementById('ptz-up');
        const ptzDown = document.getElementById('ptz-down');
        const ptzLeft = document.getElementById('ptz-left');
        const ptzRight = document.getElementById('ptz-right');
        const ptzReset = document.getElementById('ptz-reset');
        const ptzZoomIn = document.getElementById('ptz-zoomin');
        const ptzZoomOut = document.getElementById('ptz-zoomout');

        function switchCamera(cam) {
            activeCam = cam;
            staticIntensity = 1.0;
            
            // Turn off webcam stream if switching away from cam3
            if (cam !== 'cam3') {
                stopWebcam();
                if (webcamVideo) webcamVideo.pause();
                if (webcamSourceControl) webcamSourceControl.style.display = 'none';
            } else {
                if (webcamSourceControl) webcamSourceControl.style.display = 'flex';
            }
            
            // Clear styles for all tabs
            [cam1Tab, cam2Tab, cam3Tab].forEach(tab => {
                if (tab) {
                    tab.style.backgroundColor = '#37474f';
                    tab.style.color = 'white';
                }
            });
            
            if (cam === 'cam1') {
                cam1Tab.style.backgroundColor = 'var(--primary-color)';
                cam1Tab.style.color = '#0b1218';
                camName.textContent = 'CAM-01 // TANK_CHAMBER_A';
                addLog('Switched feed to Camera 1 (Tank).', 'info');
            } else if (cam === 'cam2') {
                cam2Tab.style.backgroundColor = 'var(--primary-color)';
                cam2Tab.style.color = '#0b1218';
                camName.textContent = 'CAM-02 // INLET_VALVE_B';
                addLog('Switched feed to Camera 2 (Valve).', 'info');
            } else if (cam === 'cam3') {
                cam3Tab.style.backgroundColor = 'var(--primary-color)';
                cam3Tab.style.color = '#0b1218';
                camName.textContent = videoSourceMode === 'webcam' ? 'CAM-03 // LIVE_WEBCAM_FEED' : 'CAM-03 // CUSTOM_VIDEO_FEED';
                addLog('Initiating Live Feed screen...', 'info');
                
                if (videoSourceMode === 'webcam') {
                    startWebcam();
                } else {
                    if (webcamVideo && webcamVideo.src) {
                        webcamActive = true;
                        webcamError = false;
                        webcamVideo.play().catch(err => console.error("File play resume failed:", err));
                    } else {
                        addLog("No video file loaded. Click 'Video File' to select a clip.", "warn");
                    }
                }
            }
        }

        function switchFilter(filter) {
            videoFilter = filter;
            staticIntensity = 0.5;
            
            [filterNormal, filterNv, filterThermal].forEach(btn => {
                btn.style.backgroundColor = '#37474f';
                btn.style.color = 'white';
            });

            if (filter === 'normal') {
                filterNormal.style.backgroundColor = 'var(--primary-color)';
                filterNormal.style.color = '#0b1218';
                camRecText.textContent = 'REC 1080P';
            } else if (filter === 'nv') {
                filterNv.style.backgroundColor = 'var(--primary-color)';
                filterNv.style.color = '#0b1218';
                camRecText.textContent = 'REC 1080P IR';
            } else if (filter === 'thermal') {
                filterThermal.style.backgroundColor = 'var(--primary-color)';
                filterThermal.style.color = '#0b1218';
                camRecText.textContent = 'REC 1080P FLIR';
            }
        }

        // Add event listeners
        cam1Tab.addEventListener('click', () => switchCamera('cam1'));
        cam2Tab.addEventListener('click', () => switchCamera('cam2'));
        if (cam3Tab) {
            cam3Tab.addEventListener('click', () => switchCamera('cam3'));
        }
        
        // Canvas click handler to easily load video files if webcam access is denied
        canvas.addEventListener('click', () => {
            if (activeCam === 'cam3') {
                if (videoSourceMode === 'file' || webcamError) {
                    if (videoFileInput) videoFileInput.click();
                }
            }
        });
        
        filterNormal.addEventListener('click', () => switchFilter('normal'));
        filterNv.addEventListener('click', () => switchFilter('nv'));
        filterThermal.addEventListener('click', () => switchFilter('thermal'));

        // PTZ handlers
        ptzUp.addEventListener('click', () => { ptzY = Math.max(-50, ptzY - 10); });
        ptzDown.addEventListener('click', () => { ptzY = Math.min(50, ptzY + 10); });
        ptzLeft.addEventListener('click', () => { ptzX = Math.max(-50, ptzX - 10); });
        ptzRight.addEventListener('click', () => { ptzX = Math.min(50, ptzX + 10); });
        ptzReset.addEventListener('click', () => { ptzX = 0; ptzY = 0; ptzZoom = 1.0; });
        ptzZoomIn.addEventListener('click', () => { ptzZoom = Math.min(2.5, ptzZoom + 0.15); });
        ptzZoomOut.addEventListener('click', () => { ptzZoom = Math.max(0.8, ptzZoom - 0.15); });

        // Animation calculations
        let animFrame = 0;

        function renderCamera() {
            animFrame++;
            
            // Clear canvas
            ctx.fillStyle = '#080f14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Apply PTZ adjustments
            ctx.translate(canvas.width / 2 + ptzX, canvas.height / 2 + ptzY);
            ctx.scale(ptzZoom, ptzZoom);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            // Draw content based on active camera
            if (activeCam === 'cam1') {
                drawTankView();
            } else if (activeCam === 'cam2') {
                drawValveView();
            } else if (activeCam === 'cam3') {
                drawWebcamView();
            }

            ctx.restore();

            // Post-processing filter effects
            applyVideoFilter();

            // Draw Static Noise
            if (staticIntensity > 0) {
                drawStaticNoise();
                staticIntensity -= 0.05;
            }

            // Draw HUD (static overlay that shouldn't pan/zoom)
            drawHUD();

            // Loop
            requestAnimationFrame(renderCamera);
        }

        function drawTankView() {
            // Background grid pattern
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath();
                ctx.moveTo(0, j);
                ctx.lineTo(canvas.width, j);
                ctx.stroke();
            }

            // Draw Tank borders
            ctx.strokeStyle = videoFilter === 'thermal' ? '#1a237e' : 'rgba(79, 195, 247, 0.3)';
            ctx.lineWidth = 4;
            const tankX = 220;
            const tankY = 60;
            const tankW = 200;
            const tankH = 240;

            // Draw pipe inlet
            ctx.fillStyle = videoFilter === 'thermal' ? '#4a148c' : '#1e2d3b';
            ctx.fillRect(120, tankY + 20, 100, 20);
            
            // Draw tank body
            ctx.beginPath();
            ctx.moveTo(tankX, tankY);
            ctx.lineTo(tankX, tankY + tankH);
            ctx.lineTo(tankX + tankW, tankY + tankH);
            ctx.lineTo(tankX + tankW, tankY);
            ctx.stroke();

            // Draw Gradations
            ctx.fillStyle = videoFilter === 'nv' ? '#2ec471' : 'rgba(255, 255, 255, 0.4)';
            ctx.font = '10px monospace';
            ctx.textAlign = 'right';
            for (let percent = 25; percent <= 100; percent += 25) {
                const gy = tankY + tankH - (tankH * (percent / 100));
                ctx.fillRect(tankX - 8, gy, 8, 1);
                ctx.fillText(percent + '%', tankX - 12, gy + 3);
            }

            // Draw Water
            const currentWaterHeight = tankH * (waterLevel / 100);
            const waterY = tankY + tankH - currentWaterHeight;
            
            if (waterLevel > 0) {
                ctx.save();
                // Create clipping region to tank area
                ctx.beginPath();
                ctx.rect(tankX + 2, tankY, tankW - 4, tankH);
                ctx.clip();

                // Draw moving wave
                ctx.beginPath();
                ctx.moveTo(tankX, waterY);
                const waveAmplitude = 5;
                const waveFreq = 0.02;
                for (let x = tankX; x <= tankX + tankW; x++) {
                    const y = waterY + waveAmplitude * Math.sin((x * waveFreq) + (animFrame * 0.05));
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(tankX + tankW, tankY + tankH);
                ctx.lineTo(tankX, tankY + tankH);
                ctx.closePath();

                if (videoFilter === 'thermal') {
                    // Thermal water is cold (blue)
                    let grad = ctx.createLinearGradient(0, waterY, 0, tankY + tankH);
                    grad.addColorStop(0, '#0d47a1');
                    grad.addColorStop(1, '#000033');
                    ctx.fillStyle = grad;
                } else if (videoFilter === 'nv') {
                    ctx.fillStyle = 'rgba(46, 204, 113, 0.4)';
                } else {
                    let grad = ctx.createLinearGradient(0, waterY, 0, tankY + tankH);
                    grad.addColorStop(0, 'rgba(128, 222, 234, 0.7)');
                    grad.addColorStop(1, 'rgba(1, 87, 155, 0.8)');
                    ctx.fillStyle = grad;
                }
                ctx.fill();
                ctx.restore();
            }

            // Droplets animation (when flow rate > 0 and valve open)
            if (valveOpen && flowRate > 0) {
                if (animFrame % 8 === 0) {
                    droplets.push({ x: 210, y: tankY + 30, vy: 3 + Math.random() * 2 });
                }
            }

            // Draw droplets
            ctx.fillStyle = videoFilter === 'thermal' ? '#ff9100' : (videoFilter === 'nv' ? '#2ec471' : '#80deea');
            for (let i = droplets.length - 1; i >= 0; i--) {
                const drop = droplets[i];
                drop.y += drop.vy;
                
                ctx.beginPath();
                ctx.arc(drop.x, drop.y, 3, 0, Math.PI * 2);
                ctx.fill();

                // Collision with water level or bottom of tank
                const collisionY = tankY + tankH - currentWaterHeight;
                if (drop.y >= collisionY) {
                    droplets.splice(i, 1);
                }
            }
        }

        function drawValveView() {
            // Draw Pipes
            const pipeY = 150;
            const pipeH = 50;

            ctx.fillStyle = videoFilter === 'thermal' ? '#15152a' : '#101d28';
            ctx.fillRect(0, pipeY, canvas.width, pipeH);
            
            ctx.strokeStyle = videoFilter === 'thermal' ? '#3f51b5' : 'rgba(79, 195, 247, 0.3)';
            ctx.lineWidth = 3;
            ctx.strokeRect(-10, pipeY, canvas.width + 20, pipeH);

            // Valve housing in the middle
            const valveX = canvas.width / 2 - 50;
            const valveY = pipeY - 25;
            const valveW = 100;
            const valveH = 100;

            // Draw Valve main body
            ctx.fillStyle = videoFilter === 'thermal' ? '#263238' : '#223446';
            ctx.strokeStyle = videoFilter === 'thermal' ? '#ff1744' : 'rgba(79, 195, 247, 0.5)';
            ctx.fillRect(valveX, valveY, valveW, valveH);
            ctx.strokeRect(valveX, valveY, valveW, valveH);

            // Actuator coil (hot in thermal when active/open)
            const coilX = valveX + 20;
            const coilY = valveY - 30;
            const coilW = 60;
            const coilH = 30;
            if (valveOpen) {
                ctx.fillStyle = videoFilter === 'thermal' ? '#ff3d00' : '#4caf50'; // Hot orange / green
            } else {
                ctx.fillStyle = videoFilter === 'thermal' ? '#0d47a1' : '#e53935'; // Cold blue / red
            }
            ctx.fillRect(coilX, coilY, coilW, coilH);
            ctx.strokeRect(coilX, coilY, coilW, coilH);

            // Coil label
            ctx.fillStyle = '#fff';
            ctx.font = '8px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(valveOpen ? 'SOLENOID [ON]' : 'SOLENOID [OFF]', valveX + 50, coilY + 18);

            // Status light indicator
            ctx.beginPath();
            ctx.arc(valveX + 50, valveY + 50, 8, 0, Math.PI * 2);
            ctx.fillStyle = valveOpen ? '#4caf50' : '#e53935';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            // Text Label
            ctx.fillStyle = videoFilter === 'nv' ? '#2ec471' : 'rgba(255, 255, 255, 0.8)';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText("VALVE_ACTUATOR_V12", valveX + 50, valveY + 80);

            // Particles flow logic (when valve is open & flowing)
            if (valveOpen && flowRate > 0) {
                // Add new particle
                if (animFrame % 4 === 0) {
                    particles.push({
                        x: 0,
                        y: pipeY + 5 + Math.random() * (pipeH - 10),
                        r: 2 + Math.random() * 3,
                        v: 4 + (flowRate / 5)
                    });
                }
            }

            // Draw particles
            ctx.fillStyle = videoFilter === 'thermal' ? '#ffd600' : (videoFilter === 'nv' ? '#2ec471' : '#80deea');
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.v;

                // If valve is closed and particle is left of valve, stop it
                if (!valveOpen && p.x >= valveX && p.x <= valveX + 10) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();

                if (p.x > canvas.width) {
                    particles.splice(i, 1);
                }
            }
        }

        function applyVideoFilter() {
            if (videoFilter === 'nv') {
                // Night vision tint overlay
                ctx.fillStyle = 'rgba(46, 204, 113, 0.12)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Add IR light focus effect
                let irGrad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 50, canvas.width / 2, canvas.height / 2, 300);
                irGrad.addColorStop(0, 'rgba(255,255,255,0.05)');
                irGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
                ctx.fillStyle = irGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

            } else if (videoFilter === 'thermal') {
                // FLIR mode overlay
                ctx.fillStyle = 'rgba(49, 27, 146, 0.15)'; // Deep indigo tint
                ctx.fillRect(0, 0, canvas.width, canvas.height);

            } else {
                // Normal CCTV tint
                ctx.fillStyle = 'rgba(79, 195, 247, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function drawStaticNoise() {
            const lines = Math.floor(staticIntensity * 12);
            ctx.fillStyle = `rgba(255, 255, 255, ${staticIntensity * 0.35})`;
            for (let i = 0; i < lines; i++) {
                const h = Math.random() * 20;
                const y = Math.random() * canvas.height;
                ctx.fillRect(0, y, canvas.width, h);
            }
            
            // Random dots
            ctx.fillStyle = `rgba(128, 128, 128, ${staticIntensity * 0.25})`;
            for (let i = 0; i < 50; i++) {
                const rx = Math.random() * canvas.width;
                const ry = Math.random() * canvas.height;
                const rw = Math.random() * 4;
                const rh = Math.random() * 4;
                ctx.fillRect(rx, ry, rw, rh);
            }
        }

        function drawHUD() {
            // Update time
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            camTime.textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

            // Check warning visibility based on actual sensor state
            if (leakDetected) {
                camAnomaly.style.display = 'block';
                camAnomaly.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="margin-right: 8px;"></i>ANOMALY: LEAK DETECTED';
            } else if (waterLevel >= 95) {
                camAnomaly.style.display = 'block';
                camAnomaly.innerHTML = '<i class="fa-solid fa-water" style="margin-right: 8px;"></i>WARNING: TANK OVERFLOW';
            } else {
                camAnomaly.style.display = 'none';
            }
        }

        // --- MULTI-SCREEN NAVIGATION LOGIC ---
        const screens = ['home', 'cctv', 'analytics', 'alerts', 'dev'];
        
        function switchScreen(screenName) {
            screens.forEach(s => {
                const screenEl = document.getElementById(`screen-${s}`);
                const navEl = document.getElementById(`nav-${s}`);
                if (screenEl && navEl) {
                    if (s === screenName) {
                        screenEl.classList.add('active');
                        navEl.classList.add('active');
                    } else {
                        screenEl.classList.remove('active');
                        navEl.classList.remove('active');
                    }
                }
            });
            
            // Add static visual glitch effect on CCTV tab switch
            if (screenName === 'cctv') {
                staticIntensity = 0.6;
            } else {
                // Stop webcam stream tracks or pause file playing if navigating away from CCTV tab
                stopWebcam();
                if (webcamVideo) {
                    webcamVideo.pause();
                }
                if (webcamSourceControl) webcamSourceControl.style.display = 'none';
                
                // Reset camera back to cam1 when switching tabs
                if (activeCam === 'cam3') {
                    activeCam = 'cam1';
                    if (cam1Tab && cam2Tab && cam3Tab) {
                        cam1Tab.style.backgroundColor = 'var(--primary-color)';
                        cam1Tab.style.color = '#0b1218';
                        cam2Tab.style.backgroundColor = '#37474f';
                        cam2Tab.style.color = 'white';
                        cam3Tab.style.backgroundColor = '#37474f';
                        cam3Tab.style.color = 'white';
                    }
                }
            }
        }
        
        // Bind bottom navigation click event listeners
        screens.forEach(s => {
            const navEl = document.getElementById(`nav-${s}`);
            if (navEl) {
                navEl.addEventListener('click', () => switchScreen(s));
            }
        });

        // Update simulated time in status bar
        function updateStatusBarTime() {
            const timeEl = document.getElementById('status-bar-time');
            if (timeEl) {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                timeEl.textContent = `${hh}:${mm}`;
            }
        }
        updateStatusBarTime();
        setInterval(updateStatusBarTime, 30000);

        // --- LIVE WEBCAM IMPLEMENTATION ---
        function startWebcam() {
            webcamActive = true;
            webcamError = false;
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 350 } })
                    .then(stream => {
                        if (activeCam === 'cam3' && webcamActive && videoSourceMode === 'webcam') {
                            webcamStream = stream;
                            webcamVideo.src = '';
                            webcamVideo.srcObject = stream;
                            webcamVideo.play().catch(err => {
                                console.error("Video play failed:", err);
                            });
                            addLog("Live Webcam stream connected successfully.", "success");
                        } else {
                            stream.getTracks().forEach(track => track.stop());
                        }
                    })
                    .catch(err => {
                        console.error("Webcam access error:", err);
                        addLog("Webcam access denied. Connecting to fallback live stream...", "warn");
                        loadFallbackVideoStream();
                    });
            } else {
                addLog("Webcam API not supported. Connecting to fallback live stream...", "warn");
                loadFallbackVideoStream();
            }
        }

        function loadFallbackVideoStream() {
            webcamActive = true;
            webcamError = false;
            
            // Public high-quality loop of flowing water (perfect for Aqua Guard!)
            const fallbackUrl = "https://assets.mixkit.co/videos/preview/mixkit-flow-of-water-under-a-small-bridge-34407-large.mp4";
            
            webcamVideo.srcObject = null;
            webcamVideo.src = fallbackUrl;
            webcamVideo.loop = true;
            webcamVideo.muted = true; // Mute to satisfy browser autoplay policy
            webcamVideo.play()
                .then(() => {
                    addLog("Live video feed connected (Fallback stream).", "info");
                })
                .catch(err => {
                    console.error("Fallback video play failed:", err);
                    webcamError = true; // Show test card if fallback fails
                });
        }

        function stopWebcam() {
            webcamActive = false;
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
                webcamStream = null;
            }
            if (webcamVideo) {
                if (videoSourceMode === 'webcam') {
                    webcamVideo.srcObject = null;
                }
            }
        }

        function loadLocalVideo(file) {
            if (!file) return;
            
            stopWebcam();
            
            if (activeVideoUrl) {
                URL.revokeObjectURL(activeVideoUrl);
            }
            
            webcamActive = true;
            webcamError = false;
            
            activeVideoUrl = URL.createObjectURL(file);
            webcamVideo.srcObject = null;
            webcamVideo.src = activeVideoUrl;
            webcamVideo.loop = true;
            webcamVideo.play()
                .then(() => {
                    addLog(`Successfully loaded video file: ${file.name}`, "success");
                })
                .catch(err => {
                    console.error("Local video play failed:", err);
                    webcamError = true;
                    addLog("CCTV ERROR: Failed to play the selected video file.", "error");
                });
        }

        let cctvFrame = 0;
        function drawAnimatedCCTVFallback() {
            cctvFrame++;
            
            // Clear background
            ctx.fillStyle = '#050c12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(79, 195, 247, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw a big industrial water pipe in the center
            ctx.fillStyle = '#1c2d3d';
            ctx.fillRect(50, 130, 540, 90);
            
            // Highlight reflections on the pipe
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fillRect(50, 130, 540, 15);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(50, 205, 540, 15);
            
            // Draw pipe joints/rings
            ctx.fillStyle = '#37474f';
            ctx.fillRect(120, 120, 15, 110);
            ctx.fillRect(500, 120, 15, 110);
            
            // Draw flowing water inside a cutout glass section of the pipe!
            ctx.fillStyle = '#0c1d28';
            ctx.fillRect(200, 140, 240, 70);
            ctx.strokeStyle = '#37474f';
            ctx.lineWidth = 3;
            ctx.strokeRect(200, 140, 240, 70);
            
            // Draw animated flowing water waves inside the glass section
            ctx.fillStyle = 'rgba(79, 195, 247, 0.25)';
            ctx.beginPath();
            ctx.moveTo(200, 210);
            for (let x = 200; x <= 440; x += 5) {
                const waveY = 175 + Math.sin((x / 20) + (cctvFrame / 5)) * 8;
                ctx.lineTo(x, waveY);
            }
            ctx.lineTo(440, 210);
            ctx.closePath();
            ctx.fill();
            
            // Draw animated bubbles inside the water flow
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 15; i++) {
                const bx = 200 + ((cctvFrame * 2 + i * 45) % 240);
                const by = 150 + (Math.sin(bx / 10 + i) * 12) + 20;
                const br = 1 + (i % 3);
                ctx.beginPath();
                ctx.arc(bx, by, br, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw animated impeller/flow wheel inside the glass pipe
            ctx.save();
            ctx.translate(320, 175);
            ctx.rotate(cctvFrame * 0.08);
            ctx.strokeStyle = 'var(--primary-color)';
            ctx.lineWidth = 4;
            // Draw 4 blades
            for (let j = 0; j < 4; j++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -22);
                ctx.stroke();
                ctx.rotate(Math.PI / 2);
            }
            ctx.fillStyle = '#37474f';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            // Draw telemetry data overlays (changing dynamically!)
            ctx.fillStyle = '#80deea';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'left';
            
            // Simulated sensor data
            const flowRate = (12.0 + Math.sin(cctvFrame / 50) * 0.4).toFixed(2);
            const pressure = (3.15 + Math.cos(cctvFrame / 30) * 0.05).toFixed(3);
            const waterTemp = (23.8 + Math.sin(cctvFrame / 100) * 0.2).toFixed(1);
            
            ctx.fillText(`FLOW: ${flowRate} L/MIN`, 220, 80);
            ctx.fillText(`PRES: ${pressure} BAR`, 220, 95);
            ctx.fillText(`TEMP: ${waterTemp} C`, 220, 110);
            
            // Corner camera crosshair marks
            ctx.strokeStyle = 'rgba(79, 195, 247, 0.3)';
            ctx.lineWidth = 1.5;
            // Top Left corner bracket
            ctx.beginPath();
            ctx.moveTo(30, 50); ctx.lineTo(30, 30); ctx.lineTo(50, 30);
            ctx.stroke();
            // Top Right
            ctx.beginPath();
            ctx.moveTo(610, 50); ctx.lineTo(610, 30); ctx.lineTo(590, 30);
            ctx.stroke();
            // Bottom Left
            ctx.beginPath();
            ctx.moveTo(30, 300); ctx.lineTo(30, 320); ctx.lineTo(50, 320);
            ctx.stroke();
            // Bottom Right
            ctx.beginPath();
            ctx.moveTo(610, 300); ctx.lineTo(610, 320); ctx.lineTo(590, 320);
            ctx.stroke();
            
            // Center crosshair
            ctx.beginPath();
            ctx.moveTo(310, 175); ctx.lineTo(330, 175);
            ctx.moveTo(320, 165); ctx.lineTo(320, 185);
            ctx.stroke();
            
            // Live watermark
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(10, 50, 140, 20);
            ctx.fillStyle = '#80deea';
            ctx.font = '10px monospace';
            ctx.fillText("LIVE WATER FLOW SIM", 18, 63);
            
            // Draw instructions helper overlay (subtle text at the bottom)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.font = '9px monospace';
            ctx.textAlign = 'center';
            ctx.fillText("[ CLICK HERE OR CHOOSE 'VIDEO FILE' BELOW TO SELECT YOUR OWN CLIP ]", canvas.width / 2, 290);
        }

        function drawWebcamView() {
            if (videoSourceMode === 'webcam' && webcamVideo && webcamVideo.readyState >= 2 && !webcamError && !webcamVideo.src) {
                // Draw active video frames
                ctx.drawImage(webcamVideo, 0, 0, canvas.width, canvas.height);
                
                // Overlay watermark
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(10, 50, 140, 20);
                ctx.fillStyle = '#80deea';
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.fillText("LIVE WEBCAM STREAM", 18, 63);
            } else if (videoSourceMode === 'file' && webcamVideo && (webcamVideo.readyState >= 2 || webcamVideo.src) && !webcamError) {
                // Draw custom video file frames
                ctx.drawImage(webcamVideo, 0, 0, canvas.width, canvas.height);
                
                // Overlay watermark
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(10, 50, 140, 20);
                ctx.fillStyle = '#80deea';
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.fillText("LOCAL VIDEO FEED", 18, 63);
            } else {
                // Fallback to animated simulated CCTV water flow feed (guaranteed to render everywhere!)
                drawAnimatedCCTVFallback();
            }
        }

        // Bind source control toggles and file input listener
        if (webcamSourceControl && btnSrcWebcam && btnSrcFile && videoFileInput) {
            btnSrcWebcam.addEventListener('click', () => {
                videoSourceMode = 'webcam';
                btnSrcWebcam.style.backgroundColor = 'var(--primary-color)';
                btnSrcWebcam.style.color = '#0b1218';
                btnSrcFile.style.backgroundColor = '#37474f';
                btnSrcFile.style.color = 'white';
                
                if (activeVideoUrl) {
                    URL.revokeObjectURL(activeVideoUrl);
                    activeVideoUrl = null;
                }
                webcamVideo.src = '';
                
                camName.textContent = 'CAM-03 // LIVE_WEBCAM_FEED';
                startWebcam();
            });
            
            btnSrcFile.addEventListener('click', () => {
                videoSourceMode = 'file';
                btnSrcFile.style.backgroundColor = 'var(--primary-color)';
                btnSrcFile.style.color = '#0b1218';
                btnSrcWebcam.style.backgroundColor = '#37474f';
                btnSrcWebcam.style.color = 'white';
                
                stopWebcam();
                videoFileInput.click();
            });
            
            videoFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    camName.textContent = `CAM-03 // ${file.name.toUpperCase().substring(0, 16)}`;
                    loadLocalVideo(file);
                }
            });
        }

        // --- LOGIN PAGE LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('demo') === 'true') {
            sessionStorage.setItem('aqua_guard_logged_in', 'true');
        }

        // Check if user is already logged in (via sessionStorage)
        if (sessionStorage.getItem('aqua_guard_logged_in') === 'true') {
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
            
            if (urlParams.get('demo') === 'true') {
                switchScreen('cctv');
                switchCamera('cam3');
            } else {
                switchScreen('home');
            }
        } else {
            loginView.style.display = 'flex';
            dashboardView.style.display = 'none';
        }

        // Email validation helper
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // --- VALIDATION BINDINGS ---
        // Login validation
        function validateLoginForm() {
            const emailVal = loginEmail.value.trim();
            const passwordVal = loginPassword.value;
            const valid = isValidEmail(emailVal) && passwordVal.length >= 6;
            loginSubmitBtn.disabled = !valid;
        }

        loginEmail.addEventListener('input', validateLoginForm);
        loginPassword.addEventListener('input', validateLoginForm);

        // Register validation
        function validateRegisterForm() {
            const nameVal = registerName.value.trim();
            const emailVal = registerEmail.value.trim();
            const passwordVal = registerPassword.value;
            const valid = nameVal.length > 0 && isValidEmail(emailVal) && passwordVal.length >= 6;
            registerSubmitBtn.disabled = !valid;
        }

        registerName.addEventListener('input', validateRegisterForm);
        registerEmail.addEventListener('input', validateRegisterForm);
        registerPassword.addEventListener('input', validateRegisterForm);

        // Forgot password validation
        function validateForgotForm() {
            const emailVal = forgotEmail.value.trim();
            const valid = isValidEmail(emailVal);
            forgotSubmitBtn.disabled = !valid;
        }

        forgotEmail.addEventListener('input', validateForgotForm);

        // --- PASSWORD VISIBILITY TOGGLERS ---
        // Login password toggle
        let passwordVisible = false;
        loginTogglePassword.addEventListener('click', () => {
            passwordVisible = !passwordVisible;
            if (passwordVisible) {
                loginPassword.type = 'text';
                loginTogglePassword.innerHTML = '<i class="fa-solid fa-eye"></i>';
            } else {
                loginPassword.type = 'password';
                loginTogglePassword.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            }
        });

        // Register password toggle
        let regPasswordVisible = false;
        registerTogglePassword.addEventListener('click', () => {
            regPasswordVisible = !regPasswordVisible;
            if (regPasswordVisible) {
                registerPassword.type = 'text';
                registerTogglePassword.innerHTML = '<i class="fa-solid fa-eye"></i>';
            } else {
                registerPassword.type = 'password';
                registerTogglePassword.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            }
        });

        // --- VIEW SWITCHING TRANSTIONS ---
        function switchAuthScreen(screenName) {
            // Hide messages
            loginError.style.display = 'none';

            // Determine active forms and texts
            const forms = [loginForm, registerForm, forgotForm];
            let targetForm;
            let titleText;
            let subtitleText;

            if (screenName === 'login') {
                targetForm = loginForm;
                titleText = "Aqua Guard";
                subtitleText = "Smart Water Management System";
            } else if (screenName === 'register') {
                targetForm = registerForm;
                titleText = "Create Account";
                subtitleText = "Join Aqua Guard to save water together";
            } else if (screenName === 'forgot') {
                targetForm = forgotForm;
                titleText = "Reset Password";
                subtitleText = "Enter your email to receive a reset link";
            }

            // Animate card swap
            const card = document.querySelector('.login-card');
            card.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
            card.style.opacity = '0.3';
            card.style.transform = 'scale(0.97)';

            setTimeout(() => {
                // Swap visibility
                forms.forEach(f => f.style.display = 'none');
                targetForm.style.display = 'block';

                // Update headers
                authTitle.textContent = titleText;
                authSubtitle.textContent = subtitleText;

                // Reset forms
                loginEmail.value = '';
                loginPassword.value = '';
                registerName.value = '';
                registerEmail.value = '';
                registerPassword.value = '';
                forgotEmail.value = '';
                
                validateLoginForm();
                validateRegisterForm();
                validateForgotForm();

                // Fade back in
                card.style.opacity = '1';
                card.style.transform = 'scale(1)';
            }, 200);
        }

        // Navigation listeners
        linkForgotPassword.addEventListener('click', (e) => { e.preventDefault(); switchAuthScreen('forgot'); });
        linkToRegister.addEventListener('click', (e) => { e.preventDefault(); switchAuthScreen('register'); });
        linkToLoginFromReg.addEventListener('click', (e) => { e.preventDefault(); switchAuthScreen('login'); });
        linkToLoginFromForgot.addEventListener('click', (e) => { e.preventDefault(); switchAuthScreen('login'); });

        // --- SUBMIT HANDLERS ---
        // Login submit
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            loginError.style.display = 'none';
            loginSuccess.style.display = 'none';
            
            loginEmail.disabled = true;
            loginPassword.disabled = true;
            loginTogglePassword.disabled = true;
            loginSubmitBtn.disabled = true;
            
            loginBtnText.style.display = 'none';
            loginBtnSpinner.style.display = 'block';
            
            setTimeout(() => {
                const emailVal = loginEmail.value.trim();
                const passwordVal = loginPassword.value;
                
                if (emailVal === 'admin@aquaguard.com' && passwordVal === 'admin123') {
                    sessionStorage.setItem('aqua_guard_logged_in', 'true');
                    
                    loginView.style.opacity = '0';
                    loginView.style.transform = 'scale(1.05)';
                    
                    setTimeout(() => {
                        loginView.style.display = 'none';
                        dashboardView.style.display = 'block';
                        dashboardView.style.opacity = '0';
                        dashboardView.style.transition = 'opacity 0.5s ease';
                        
                        dashboardView.offsetHeight;
                        dashboardView.style.opacity = '1';
                        
                        loginEmail.value = '';
                        loginPassword.value = '';
                        loginEmail.disabled = false;
                        loginPassword.disabled = false;
                        loginTogglePassword.disabled = false;
                        loginBtnText.style.display = 'block';
                        loginBtnSpinner.style.display = 'none';
                        switchScreen('home');
                    }, 400);
                } else {
                    loginError.textContent = "Invalid email address or password. Try admin@aquaguard.com / admin123";
                    loginError.style.display = 'block';
                    
                    loginEmail.disabled = false;
                    loginPassword.disabled = false;
                    loginTogglePassword.disabled = false;
                    loginSubmitBtn.disabled = false;
                    loginBtnText.style.display = 'block';
                    loginBtnSpinner.style.display = 'none';
                }
            }, 1200);
        });

        // Register submit
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            loginError.style.display = 'none';
            loginSuccess.style.display = 'none';

            registerName.disabled = true;
            registerEmail.disabled = true;
            registerPassword.disabled = true;
            registerTogglePassword.disabled = true;
            registerSubmitBtn.disabled = true;

            registerBtnText.style.display = 'none';
            registerBtnSpinner.style.display = 'block';

            setTimeout(() => {
                // Success simulation message
                loginSuccess.textContent = "Account created successfully! Please sign in.";
                loginSuccess.style.display = 'block';

                registerName.disabled = false;
                registerEmail.disabled = false;
                registerPassword.disabled = false;
                registerTogglePassword.disabled = false;
                registerBtnText.style.display = 'block';
                registerBtnSpinner.style.display = 'none';

                // Switch back to login view
                switchAuthScreen('login');
            }, 1200);
        });

        // Forgot password submit
        forgotForm.addEventListener('submit', (e) => {
            e.preventDefault();
            loginError.style.display = 'none';
            loginSuccess.style.display = 'none';

            const userEmail = forgotEmail.value.trim();
            forgotEmail.disabled = true;
            forgotSubmitBtn.disabled = true;

            forgotBtnText.style.display = 'none';
            forgotBtnSpinner.style.display = 'block';

            setTimeout(() => {
                // Success simulation message
                loginSuccess.textContent = `A reset link was sent to ${userEmail} (simulated).`;
                loginSuccess.style.display = 'block';

                forgotEmail.disabled = false;
                forgotBtnText.style.display = 'block';
                forgotBtnSpinner.style.display = 'none';

                // Switch back to login view
                switchAuthScreen('login');
            }, 1200);
        });

        // Logout Event Listener
        btnLogout.addEventListener('click', () => {
            sessionStorage.removeItem('aqua_guard_logged_in');
            
            dashboardView.style.opacity = '0';
            setTimeout(() => {
                dashboardView.style.display = 'none';
                loginView.style.display = 'flex';
                loginView.style.opacity = '0';
                loginView.style.transform = 'scale(0.95)';
                
                loginView.offsetHeight;
                
                loginView.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                loginView.style.opacity = '1';
                loginView.style.transform = 'scale(1)';
                validateLoginForm();
            }, 300);
        });

        // Initialize Render Loop
        renderCamera();
    </script>
</body>
</html>
