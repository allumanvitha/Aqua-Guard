<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Guard - Smart Water Simulation</title>
    <script>
    window.onerror = function(message, source, lineno, colno, error) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.background = '#e53935';
        errorDiv.style.color = '#ffffff';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.padding = '24px';
        errorDiv.style.fontSize = '15px';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.lineHeight = '1.5';
        errorDiv.style.whiteSpace = 'pre-wrap';
        errorDiv.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
        errorDiv.innerText = '⚠️ JAVASCRIPT EXCEPTION ENCOUNTERED:\n\n' + 
                             'Message: ' + message + '\n' +
                             'Line: ' + lineno + '\n' +
                             'Source: ' + source + '\n\n' +
                             (error && error.stack ? 'Stack Trace:\n' + error.stack : 'No stack trace available.');
        document.body.appendChild(errorDiv);
        return false;
    };
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b1218;
            --surface-color: rgba(21, 32, 43, 0.7);
            --border-color: rgba(79, 195, 247, 0.15);
            --primary-color: #4fc3f7;
            --primary-gradient: linear-gradient(135deg, #80deea, #0288d1);
            --secondary-color: #26c6da;
            --danger-color: #e53935;
            --danger-bg: rgba(229, 57, 53, 0.15);
            --success-color: #4caf50;
            --success-bg: rgba(76, 175, 80, 0.15);
            --text-color: #e2e2e6;
            --text-muted: rgba(226, 226, 230, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(2, 136, 209, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(38, 198, 218, 0.08) 0%, transparent 40%);
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            background-color: rgba(11, 18, 24, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            font-size: 28px;
            color: var(--primary-color);
            -webkit-text-fill-color: initial;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--success-bg);
            color: var(--success-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(76, 175, 80, 0.3);
            transition: all 0.3s ease;
        }

        .system-status.alarm {
            background-color: var(--danger-bg);
            color: var(--danger-color);
            border-color: rgba(229, 57, 53, 0.3);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .main-container {
            max-width: 1400px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            flex-grow: 1;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(79, 195, 247, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: var(--primary-color);
        }

        /* Water Tank Widget */
        .tank-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .water-tank {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid rgba(79, 195, 247, 0.3);
            position: relative;
            overflow: hidden;
            background-color: rgba(79, 195, 247, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .water-wave {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 60%; /* Dynamic */
            left: -50%;
            background: linear-gradient(to top, #01579b, #0288d1, #80deea);
            border-radius: 38%;
            animation: wave 8s linear infinite;
            transition: height 1s ease;
        }

        .water-wave::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 35%;
            animation: wave 6s linear infinite;
        }

        @keyframes wave {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tank-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 800;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Metric Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            height: 100%;
        }

        .metric-item {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .metric-item.alert-active {
            border-color: rgba(229, 57, 53, 0.4);
            background-color: rgba(229, 57, 53, 0.05);
        }

        .metric-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 22px;
            font-weight: 600;
        }

        /* Control Card */
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }

        .control-row:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-info h4 {
            font-size: 16px;
            font-weight: 600;
        }

        .control-info p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Switch toggle styles */
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #37474f;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Simulation Panel */
        .sim-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sim-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .sim-btn-primary {
            background: var(--primary-gradient);
            color: #0b1218;
        }

        .sim-btn-primary:hover {
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.4);
        }

        .sim-btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .sim-btn-danger:hover {
            box-shadow: 0 0 15px rgba(229, 57, 53, 0.4);
        }

        .sim-btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .sim-btn-success:hover {
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
        }

        /* Log console */
        .log-console {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            height: 200px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            color: #80deea;
        }

        .log-line {
            margin-bottom: 6px;
            display: flex;
            gap: 8px;
        }

        .log-time {
            color: var(--text-muted);
        }

        .log-info { color: #80deea; }
        .log-warn { color: #ffb74d; }
        .log-error { color: #e57373; }

        /* Chart Canvas Simulation */
        .chart-box {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 140px;
            padding-top: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-bar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 12%;
        }

        .chart-bar {
            width: 100%;
            background: linear-gradient(to top, #0288d1, #4fc3f7);
            border-radius: 6px 6px 0 0;
            transition: height 1s ease;
        }

        .chart-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Login Styles */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            padding: 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(2, 136, 209, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(38, 198, 218, 0.15) 0%, transparent 45%);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .login-card {
            background: rgba(21, 32, 43, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(24px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(128, 222, 234, 0.1), rgba(2, 136, 209, 0.1));
            border: 1px solid rgba(79, 195, 247, 0.2);
            color: var(--primary-color);
            font-size: 42px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(2, 136, 209, 0.15);
            animation: pulseLogo 3s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(2, 136, 209, 0.15); }
            50% { transform: scale(1.04); box-shadow: 0 8px 32px rgba(2, 136, 209, 0.3); }
        }

        .login-title {
            font-size: 32px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 36px;
            font-weight: 400;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            background-color: rgba(79, 195, 247, 0.02);
            box-shadow: 0 0 12px rgba(79, 195, 247, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .input-group input:focus ~ .input-icon {
            color: var(--primary-color);
        }

        .toggle-password-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .toggle-password-btn:hover {
            color: var(--text-color);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: #0b1218;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            box-shadow: 0 4px 16px rgba(2, 136, 209, 0.25);
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(2, 136, 209, 0.4);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .login-btn:disabled {
            background: #263238;
            color: rgba(255, 255, 255, 0.25);
            cursor: not-allowed;
            box-shadow: none;
        }

        .login-error-message {
            background-color: var(--danger-bg);
            color: var(--danger-color);
            border: 1px solid rgba(229, 57, 53, 0.2);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: left;
            animation: shakeError 0.4s ease-in-out;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .login-spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(11, 18, 24, 0.2);
            border-top: 2.5px solid #0b1218;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .forgot-password-link {
            display: block;
            text-align: right;
            font-size: 13px;
            color: var(--primary-color);
            text-decoration: none;
            margin-top: -12px;
            margin-bottom: 24px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password-link:hover {
            color: var(--secondary-color);
        }

        .auth-redirect-link {
            display: inline-block;
            font-size: 14px;
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .auth-redirect-link:hover {
            color: var(--primary-color);
        }

        .credentials-tip {
            margin-top: 24px;
            padding: 12px;
            border-radius: 12px;
            background-color: rgba(79, 195, 247, 0.05);
            border: 1px dashed rgba(79, 195, 247, 0.2);
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            text-align: left;
        }
        .credentials-tip strong {
            color: var(--primary-color);
        }

        /* Phone Frame Mockup Container */
        .phone-frame {
            max-width: 420px;
            height: 840px;
            background-color: var(--bg-color);
            border: 12px solid #1c2630;
            border-radius: 44px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-bottom-width: 14px;
            border-top-width: 14px;
        }

        /* Notch overlay */
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 24px;
            background-color: #1c2630;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 999;
        }

        /* Status bar */
        .status-bar {
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px 0 24px;
            font-size: 12px;
            color: var(--text-color);
            background-color: rgba(11, 18, 24, 0.8);
            z-index: 998;
            font-weight: 600;
        }

        .status-bar-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Header in-app */
        .app-header {
            height: 56px;
            background-color: rgba(21, 32, 43, 0.5);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            backdrop-filter: blur(10px);
        }

        .app-header .logo {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-header .logo i {
            font-size: 20px;
            -webkit-text-fill-color: initial;
        }

        /* App Body and Screen Switching */
        .app-body {
            flex-grow: 1;
            overflow-y: auto;
            position: relative;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            scrollbar-width: none;
        }
        .app-body::-webkit-scrollbar {
            display: none;
        }

        .app-screen {
            display: none;
            padding: 16px;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            width: 100%;
        }

        .app-screen.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        /* Bottom Nav Menu */
        .bottom-nav {
            height: 72px;
            background-color: rgba(15, 23, 30, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 6px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            padding: 6px 0;
            font-family: 'Outfit', sans-serif;
            text-decoration: none;
        }

        .nav-icon-wrapper {
            width: 48px;
            height: 28px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 4px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-item.active .nav-icon-wrapper {
            background-color: rgba(79, 195, 247, 0.15);
            color: var(--primary-color);
        }

        .nav-item.active .nav-label {
            font-weight: 700;
        }

        /* Override layouts inside screens */
        .app-screen .card {
            width: 100%;
            margin-bottom: 0;
            padding: 20px;
        }

        /* CCTV Video viewport adjustments for mobile layout */
        .cctv-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .cctv-viewport-box {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background-color: #05080c;
            height: 220px;
            width: 100%;
        }

        .cctv-controls-row {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .cctv-filters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cctv-ptz-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
