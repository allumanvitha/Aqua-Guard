name: Appium Mobile Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-appium-tests:
    runs-on: ubuntu-latest # ubuntu runs support KVM virtualization for android emulators
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Build Android App for Testing
        run: |
          cd "Aqua Guard/frontend"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run Appium Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Start Appium Server in the background
            appium --log automation-appium-server.log &
            # Wait for Appium Server to boot
            sleep 10
            # Run Maven Appium test suite
            cd "Aqua Guard/automation"
            mvn test -Dtest=AppiumTestSuite
            
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            Aqua Guard/automation/appium/reports/
            Aqua Guard/automation/appium/logs/
