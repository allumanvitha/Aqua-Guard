name: Run Tests and Publish Report

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Selenium Web Tests & Performance Suite
        working-directory: Aqua Guard/automation
        run: |
          mvn test -Dtest=AuthSeleniumTests,DashboardSeleniumTests,DeviceAdminSeleniumTests,ReportsSeleniumTests,FirebaseConsoleSeleniumTests,PerformanceLoadTest

      - name: Prepare GH-Pages Directory structure
        if: always()
        run: |
          mkdir -p public-reports
          if [ -d "Aqua Guard/automation/reports" ]; then
            cp -r "Aqua Guard/automation/reports/"* public-reports/
          fi
          if [ ! -f "public-reports/index.html" ] && [ -f "public-reports/TestReport.html" ]; then
            cp public-reports/TestReport.html public-reports/index.html
          fi

      - name: Upload Report Directory Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-reports/

  deploy-reports-pages:
    needs: test-and-generate-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
