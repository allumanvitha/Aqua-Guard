name: Run Tests and Publish Report

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Selenium Tests (Headless)
        run: |
          cd "Aqua Guard/automation"
          mvn test -Dtest=AuthSeleniumTests,DashboardSeleniumTests,DeviceAdminSeleniumTests,ReportsSeleniumTests,FirebaseConsoleSeleniumTests
        continue-on-error: true # Ensure we still run Appium and generate reports if Selenium fails

      - name: Build Android App for Testing
        run: |
          cd "Aqua Guard/frontend"
          chmod +x gradlew
          ./gradlew assembleDebug
        continue-on-error: true

      - name: Run Appium Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            appium --log automation-appium-server.log &
            sleep 10
            cd "Aqua Guard/automation"
            mvn test -Dtest=AuthAppiumTests,DashboardAppiumTests,DeviceAppiumTests,MonitoringAppiumTests,SystemAppiumTests,PerformanceAppiumTests
        continue-on-error: true

      - name: Prepare GH-Pages Directory structure
        run: |
          mkdir -p public-reports
          if [ -d "Aqua Guard/automation/reports" ]; then
            cp -r "Aqua Guard/automation/reports/"* public-reports/
          fi

      - name: Upload Report Directory Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-reports/

  deploy-reports-pages:
    needs: test-and-generate-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
