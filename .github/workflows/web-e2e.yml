name: Web E2E Integration Tests

on:
  workflow_dispatch:

jobs:
  web-e2e-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Web E2E Suite
        run: |
          cd "Aqua Guard/automation"
          mvn test -Dtest=AuthSeleniumTests,DashboardSeleniumTests,ReportsSeleniumTests

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-reports
          path: |
            Aqua Guard/automation/selenium/reports/
