name: Mobile E2E Integration Tests

on:
  workflow_dispatch:

jobs:
  mobile-e2e-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Build Android App for Testing
        run: |
          cd "Aqua Guard/frontend"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run E2E Mobile Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            appium --log automation-appium-server-e2e.log &
            sleep 10
            cd "Aqua Guard/automation"
            mvn test -Dtest=AuthAppiumTests,DashboardAppiumTests,DeviceAppiumTests

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-reports
          path: |
            Aqua Guard/automation/appium/reports/
